name: Apply material preview and TTS consistency fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-material-tts-consistency-fix.yml
      - scripts/apply_material_tts_consistency_fix.py

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply code patch
        run: python scripts/apply_material_tts_consistency_fix.py

      - name: Compile changed Python files
        run: python -m py_compile webui/Main.py app/services/task.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webui/Main.py app/services/task.py
          git commit -m "fix compact material previews and align TTS preview"
          git push origin HEAD:main
