name: Diagnose full tests

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-tts-tests.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MPT_TEST_REDIS_HOST: 127.0.0.1
      MPT_TEST_REDIS_PORT: 6379
      MPT_TEST_REDIS_DB: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.11
      - name: Capture full test output
        shell: bash
        run: |
          set +e
          uv run --no-sync python -X utf8 -m pytest -q test > full-test-diagnostic.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> full-test-diagnostic.txt
          cat full-test-diagnostic.txt
          exit 0
      - name: Commit diagnostic log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add full-test-diagnostic.txt
          git commit -m "chore: capture full test diagnostics"
          git push origin HEAD:main
