name: Diagnose TTS tests

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-tts-tests.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Capture targeted test output
        shell: bash
        run: |
          set +e
          uv run pytest test/services/test_webui_voice_preview.py test/services/test_task.py -q > tts-test-diagnostic.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> tts-test-diagnostic.txt
          cat tts-test-diagnostic.txt
          exit 0
      - name: Commit diagnostic log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tts-test-diagnostic.txt
          git commit -m "chore: capture TTS test diagnostics"
          git push origin HEAD:main
