name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-subtitle-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.title == '[internal] apply subtitle preview'
    name: Apply subtitle preview to main
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out trigger files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: trigger

      - name: Apply preview module and Main.py integration
        shell: bash
        run: |
          cp trigger/webui/subtitle_preview.py webui/subtitle_preview.py
          python - <<'PY'
          from pathlib import Path

          path = Path("webui/Main.py")
          text = path.read_text(encoding="utf-8")

          import_line = "from webui.subtitle_preview import render_subtitle_preview\n"
          if import_line not in text:
              anchor = "from app.utils import utils\n"
              if anchor not in text:
                  raise RuntimeError("Main.py import anchor not found")
              text = text.replace(anchor, anchor + import_line, 1)

          preview_call = (
              "            render_subtitle_preview(\n"
              "                params, font_dir, st.session_state.get(\"ui_language\", \"\")\n"
              "            )\n\n"
          )
          if preview_call not in text:
              anchor = '''            if st.button(
                tr("Restore Default Subtitle Settings"),'''
              if anchor not in text:
                  raise RuntimeError("subtitle restore button anchor not found")
              text = text.replace(anchor, preview_call + anchor, 1)

          path.write_text(text, encoding="utf-8")

          temporary_workflow = Path(".github/workflows/apply-subtitle-preview.yml")
          if temporary_workflow.exists():
              temporary_workflow.unlink()
          PY

      - name: Validate preview integration
        run: |
          python -m py_compile webui/Main.py webui/subtitle_preview.py
          python - <<'PY'
          from pathlib import Path
          text = Path("webui/Main.py").read_text(encoding="utf-8")
          assert "from webui.subtitle_preview import render_subtitle_preview" in text
          assert "render_subtitle_preview(" in text
          PY

      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webui/Main.py webui/subtitle_preview.py .github/workflows/apply-subtitle-preview.yml
          git commit -m "Add subtitle preview to WebUI"
          git push origin HEAD:main

      - name: Close trigger PR
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr close "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --delete-branch || true

  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MPT_TEST_REDIS_HOST: 127.0.0.1
      MPT_TEST_REDIS_PORT: 6379
      MPT_TEST_REDIS_DB: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall app cli.py main.py webui test

      - name: Lint Python sources
        if: matrix.python-version == '3.11'
        run: uv run --no-sync ruff check app cli.py main.py webui test

      - name: Run unit tests with coverage
        run: uv run --no-sync python -X utf8 -m coverage run -m pytest -q test

      - name: Report test coverage
        run: uv run --no-sync python -m coverage report

      - name: Export coverage report
        run: uv run --no-sync python -m coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  windows-smoke:
    name: Windows smoke tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall app cli.py main.py webui test

      - name: Run core service smoke tests
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_config.py
          test/services/test_state.py
          test/services/test_task.py
          test/services/test_task_manager.py
          test/services/test_upload_post.py
          test/services/test_controller_video.py
