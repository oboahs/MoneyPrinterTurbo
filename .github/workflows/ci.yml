name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-material-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.title == '[internal] apply material review'
    name: Apply material review to main
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out trigger files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: trigger

      - name: Apply material review patch
        shell: bash
        run: |
          cp trigger/webui/material_review.py webui/material_review.py
          python trigger/tools/apply_material_review_patch.py

      - name: Validate changed files
        shell: bash
        run: |
          python -m py_compile \
            webui/Main.py \
            webui/material_review.py \
            app/services/material.py \
            app/services/task.py \
            app/services/webui_task.py
          python - <<'PY'
          import json
          from pathlib import Path

          for locale in ("webui/i18n/zh.json", "webui/i18n/en.json"):
              json.loads(Path(locale).read_text(encoding="utf-8"))

          main = Path("webui/Main.py").read_text(encoding="utf-8")
          material = Path("app/services/material.py").read_text(encoding="utf-8")
          task = Path("app/services/task.py").read_text(encoding="utf-8")
          webui_task = Path("app/services/webui_task.py").read_text(encoding="utf-8")

          assert 'key="fetch_materials_button"' in main
          assert 'key="filter_materials_button"' in main
          assert "_get_confirmed_material_review_materials(params)" in main
          assert "def search_video_candidates(" in material
          assert "preferred_items: List[MaterialInfo] | None = None" in material
          assert "preferred_materials=preferred_materials" in task
          assert "preferred_materials_snapshot" in webui_task
          PY

      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            webui/Main.py \
            webui/material_review.py \
            webui/i18n/zh.json \
            webui/i18n/en.json \
            app/services/material.py \
            app/services/task.py \
            app/services/webui_task.py
          git commit -m "Add optional material review before video generation"
          git push origin HEAD:main

      - name: Close trigger PR
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr close "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --delete-branch || true

  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MPT_TEST_REDIS_HOST: 127.0.0.1
      MPT_TEST_REDIS_PORT: 6379
      MPT_TEST_REDIS_DB: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall app cli.py main.py webui test

      - name: Lint Python sources
        if: matrix.python-version == '3.11'
        run: uv run --no-sync ruff check app cli.py main.py webui test

      - name: Run unit tests with coverage
        # pytest 兼容现有 unittest.TestCase，同时会收集仓库中的 pytest 风格
        # 测试，避免测试文件已存在但 CI 没有真正执行。
        run: uv run --no-sync python -X utf8 -m coverage run -m pytest -q test

      - name: Report test coverage
        run: uv run --no-sync python -m coverage report

      - name: Export coverage report
        run: uv run --no-sync python -m coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  windows-smoke:
    name: Windows smoke tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall app cli.py main.py webui test

      - name: Run core service smoke tests
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_config.py
          test/services/test_state.py
          test/services/test_task.py
          test/services/test_task_manager.py
          test/services/test_upload_post.py
          test/services/test_controller_video.py
